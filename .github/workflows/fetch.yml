name: fetch-fpi
on:
  schedule:
    - cron: '30 14 * * *'     # every day 8:00 PM IST; commits only when NSDL has a new report
  workflow_dispatch:
  push:
    paths: ['fetch_fpi.py', '.github/workflows/fetch.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python fetch_fpi.py
      - name: commit if changed
        run: |
          git config user.name 'fpi-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/fpi_auc.json
          git diff --cached --quiet || (git commit -m "data: NSDL FPI report $(date -u +%F)" && git push)
